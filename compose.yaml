#CONTENEDORES DE LA APLICACIÓN
services:

  #Microservicio de perfiles
  profile:
    build:
      context: ./profile
      dockerfile: Dockerfile

    env_file:
      - ./profile/.env

    ports:
      - "5002:5002" #puerto host : puerto contenedor
    environment:
      DYNAMODB_ENDPOINT: http://profile-db:8000 # Dirección donde se encuentra DynamoDB
      AWS_DEFAULT_REGION: eu-south-2 # Región configurada para el SDK de AWS
      AWS_ACCESS_KEY_ID: local  # Identificador de acceso
      AWS_SECRET_ACCESS_KEY: local # Clave secreta de acceso
      PROFILE_TABLE: Profiles #	Nombre de la tabla utilizada por el microservicio
    depends_on:
      profile-db:
        condition: service_healthy  #se inicia primero profile-db y luego profile
    networks:
    - profile-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/profile/health')"]
      interval: 30s # comprueba el estado cada 30 seg
      timeout: 5s # da como máximo 5 seg para la respuesta
      retries: 3  # se marca el contenedor no saludable después de 3 fallos seguidos
      start_period: 15s # da 15seg para arrancar sin contabilizar fallos

  #Base de datos local del microservicio de perfiles
  profile-db:
    image: amazon/dynamodb-local
    # -jar Ejecuta un programa Java mediante el sistema de ejecución de Java. DynamoDBLocal.jar	Archivo que contiene DynamoDB Local
    # -sharedDb	Utiliza una base de datos compartida para las conexiones. -dbPath	Indica dónde guardar los archivos de datos
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal 
    ports:
      - "8002:8000" #8002 puerto de windows, 8000 puerto de DynamoDB dentro del contenedor
    volumes:
      - profile-db-data:/home/dynamodblocal #donde se guardan los datos nombre:ruta
    networks:
      - profile-network
    healthcheck:
      test: ["CMD", "curl", "-sS", "-o", "/dev/null", "http://localhost:8000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Microservicio de autenticación
  login:
    build:
      context: ./login
      dockerfile: Dockerfile

    env_file:
      - ./login/.env

    ports:
      - "5003:5003"

    depends_on:
      profile:
        condition: service_healthy

    networks:
      - profile-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5003/health')"]
      interval: 30s # comprueba el estado cada 30 seg
      timeout: 5s # da como máximo 5 seg para la respuesta
      retries: 3  # se marca el contenedor no saludable después de 3 fallos seguidos
      start_period: 15s # da 15seg para arrancar sin contabilizar fallos

  # Microservicio de juego
  game:
    build:
      context: ./game
      dockerfile: Dockerfile

    env_file:
      - ./game/.env

    ports:
      - "5004:5004"

    depends_on:
      game-db:
        condition: service_healthy

    networks:
      - game-network

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5004/game/health')"]
      interval: 30s # comprueba el estado cada 30 seg
      timeout: 5s # da como máximo 5 seg para la respuesta
      retries: 3  # se marca el contenedor no saludable después de 3 fallos seguidos
      start_period: 15s # da 15seg para arrancar sin contabilizar fallos

  # Base de datos local del microservicio de juego
  game-db:
    image: amazon/dynamodb-local
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal

    ports:
      - "8004:8000"

    volumes:
      - game-db-data:/home/dynamodblocal

    networks:
      - game-network

    healthcheck:
      test: ["CMD", "curl", "-sS", "-o", "/dev/null", "http://localhost:8000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Microservicio de estadísticas
  statistics:
    build:
      context: ./statistics
      dockerfile: Dockerfile

    env_file:
      - ./statistics/.env

    ports:
      - "5005:5005"

    depends_on:
      profile:
        condition: service_healthy
      game:
        condition: service_healthy

    networks:
      - profile-network
      - game-network

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5005/statistics/health')"]
      interval: 30s # comprueba el estado cada 30 seg
      timeout: 5s # da como máximo 5 seg para la respuesta
      retries: 3  # se marca el contenedor no saludable después de 3 fallos seguidos
      start_period: 15s # da 15seg para arrancar sin contabilizar fallos



#REDES DE COMUNICACIÓN ENTRE LOS CONTENEDORES
networks:
  profile-network:
    driver: bridge #tipo de red para que se comuniquen
  game-network:
    driver: bridge



#ALMACENAMIENTO PERSISTENTE
volumes:
  profile-db-data:
    external: true #Reutilizamos el volumen que ya existe
    name: profile-db-data
  game-db-data:
    name: game-db-data