#CONTENEDORES DE LA APLICACIÓN
services:

  #Microservicio de perfiles
  profile:
    build:
      context: ./profile
      dockerfile: Dockerfile

    env_file:
      - ./profile/.env

    ports:
      - "5002:5002" #puerto host : puerto contenedor
    environment:
      DYNAMODB_ENDPOINT: http://profile-db:8000 # Dirección donde se encuentra DynamoDB
      AWS_DEFAULT_REGION: eu-south-2 # Región configurada para el SDK de AWS
      AWS_ACCESS_KEY_ID: local  # Identificador de acceso
      AWS_SECRET_ACCESS_KEY: local # Clave secreta de acceso
      PROFILE_TABLE: Profiles #	Nombre de la tabla utilizada por el microservicio
    depends_on:
      - profile-db  #se inicia primero profile-db y luego profile
    networks:
      - profile-network

  #Base de datos local del microservicio de perfiles
  profile-db:
    image: amazon/dynamodb-local
    # -jar Ejecuta un programa Java mediante el sistema de ejecución de Java. DynamoDBLocal.jar	Archivo que contiene DynamoDB Local
    # -sharedDb	Utiliza una base de datos compartida para las conexiones. -dbPath	Indica dónde guardar los archivos de datos
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal 
    ports:
      - "8002:8000" #8002 puerto de windows, 8000 puerto de DynamoDB dentro del contenedor
    volumes:
      - profile-db-data:/home/dynamodblocal #donde se guardan los datos nombre:ruta
    networks:
      - profile-network

  # Microservicio de autenticación
  login:
    build:
      context: ./login
      dockerfile: Dockerfile

    env_file:
      - ./login/.env

    ports:
      - "5003:5003"

    depends_on:
      - profile

    networks:
      - profile-network

  # Microservicio de juego
  game:
    build:
      context: ./game
      dockerfile: Dockerfile

    env_file:
      - ./game/.env

    ports:
      - "5004:5004"

    depends_on:
      - game-db

    networks:
      - game-network

  # Base de datos local del microservicio de juego
  game-db:
    image: amazon/dynamodb-local
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal

    ports:
      - "8004:8000"

    volumes:
      - game-db-data:/home/dynamodblocal

    networks:
      - game-network



#REDES DE COMUNICACIÓN ENTRE LOS CONTENEDORES
networks:
  profile-network:
    driver: bridge #tipo de red para que se comuniquen
  game-network:
    driver: bridge



#ALMACENAMIENTO PERSISTENTE
volumes:
  profile-db-data:
    external: true #Reutilizamos el volumen que ya existe
    name: profile-db-data
  game-db-data:
    name: game-db-data