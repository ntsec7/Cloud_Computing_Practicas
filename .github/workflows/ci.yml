# Workflow que se ejecuta al al hacer push o al abrir o actualizar un pull_request a main
# Ejecuta los tests para comprobar que todo funciona
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    name: Tests - ${{ matrix.service }}
    runs-on: ubuntu-latest

    env:
      AWS_DEFAULT_REGION: eu-south-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      COGNITO_REGION: eu-south-2
      DYNAMODB_ENDPOINT_URL: http://localhost:8004
      INTERNAL_SERVICE_TOKEN: test-internal-token

    strategy:
      fail-fast: false #para que si falla un test siga ejecutando los otros
      matrix:
        service:
          - login
          - profile
          - game
          - statistics

    defaults:
      run:
        working-directory: ./${{ matrix.service }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Instalar Ruff
        run: pip install ruff

      - name: Analizar código Python
        run: ruff check .

      - name: Ejecutar tests
        run: python -m pytest -v

  
  lint-dockerfiles:
    name: Analizar Dockerfiles
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Analizar Dockerfiles con Hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          recursive: true
          failure-threshold: warning